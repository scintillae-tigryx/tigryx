# -----------------------------------------------------------------------------
# Relic platform manifest: Windows XP+ / MinGW-w64 x86
# -----------------------------------------------------------------------------
id           = "windows-mingw-x86"
description  = "Windows XP+, MinGW-w64 (GCC) targeting x86 (32-bit)"
backend      = "opengl-win32"
toolchain    = "gcc"
arch         = "x86"
build_system = "cmake"
entry_point  = "build.ps1"
c_standard   = "c11"
libs         = ["winmm", "user32", "gdi32", "opengl32", "wininet"]
